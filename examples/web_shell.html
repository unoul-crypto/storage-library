<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Storage Library - Table Demo</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0c121c; }
    canvas { display: block; width: 100%; height: 100%; outline: none; }
    #status { position: fixed; top: 24px; left: 24px; color: #e6edf4; font: 18px sans-serif; }
  </style>
</head>
<body>
  <div id="status" role="status">Loading storage tables...</div>
  <canvas id="canvas" width="1120" height="700" tabindex="0" aria-label="Storage tables"></canvas>
  <script>
    const canvas = document.getElementById('canvas');
    canvas.addEventListener('contextmenu', event => event.preventDefault());
    canvas.addEventListener('webglcontextlost', event => {
      event.preventDefault();
      const status = document.getElementById('status');
      status.hidden = false;
      status.textContent = 'Graphics context lost. Reload to continue.';
    });
    var Module = {
      canvas,
      print: text => console.log(text),
      printErr: text => console.error(text),
      onRuntimeInitialized: () => { document.getElementById('status').hidden = true; },
      onAbort: () => {
        const status = document.getElementById('status');
        status.hidden = false;
        status.textContent = 'Unable to start the demo. See the browser console.';
      }
    };
  </script>
  {{{ SCRIPT }}}
</body>
</html>
